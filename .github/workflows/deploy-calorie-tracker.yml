name: Deploy Calorie Trend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['calorie-tracker/**', '.github/workflows/deploy-calorie-tracker.yml']
  pull_request:
    paths: ['calorie-tracker/**', '.github/workflows/deploy-calorie-tracker.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: calorie-tracker

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: calorie-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
